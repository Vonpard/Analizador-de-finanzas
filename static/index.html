<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analizador de Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --fondo: #14161c;
    --papel: #f7f5f0;
    --tinta: #24241f;
    --tinta-suave: #6b6a5f;
    --sello-rojo: #a13d2e;
    --sello-verde: #3f6b4f;
    --linea: #cfccc0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fondo);
    background-image: radial-gradient(circle at 50% 0%, #1e212a 0%, #14161c 60%);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 80px;
  }

  /* --- Barra de pestañas --- */
  .barra-pestanas {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 24px 0 20px;
  }

  .pestana {
    background: transparent;
    border: 1px solid #3a3d47;
    color: var(--tinta-suave);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 9px 22px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pestana:first-child { border-radius: 4px 0 0 4px; }
  .pestana:last-child { border-radius: 0 4px 4px 0; }
  .pestana.activa {
    background: var(--papel);
    color: var(--tinta);
    border-color: var(--papel);
    font-weight: 600;
  }
  .pestana:not(.activa):hover { color: #cfccc0; border-color: #565a68; }

  .vista { display: none; width: 100%; }
  .vista.activa { display: flex; justify-content: center; }

  /* ============ VISTA: REGISTRAR (recibo angosto) ============ */
  .contenedor-recibo { width: 100%; max-width: 480px; }

  .recibo {
    background: var(--papel);
    color: var(--tinta);
    padding: 28px 26px 20px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.45);
    position: relative;
  }
  .recibo::before, .recibo::after {
    content: "";
    display: block;
    position: absolute;
    left: 0; right: 0;
    height: 14px;
    background: radial-gradient(circle at 8px 7px, var(--fondo) 6px, transparent 7px) repeat-x;
    background-size: 16px 14px;
  }
  .recibo::before { top: -7px; }
  .recibo::after { bottom: -7px; transform: rotate(180deg); }

  .titulo {
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px dashed var(--linea);
    padding-bottom: 14px;
    margin-bottom: 16px;
  }
  .titulo .sub {
    display: block;
    font-weight: 400;
    font-size: 0.68rem;
    color: var(--tinta-suave);
    letter-spacing: 0.1em;
    margin-top: 4px;
  }

  .caja-registro { margin-bottom: 18px; }
  #texto-gasto {
    width: 100%;
    background: #fff;
    border: 1px dashed var(--linea);
    color: var(--tinta);
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    resize: none;
  }
  #texto-gasto:focus { outline: none; border-color: var(--tinta); }

  .caja-registro button {
    width: 100%;
    margin-top: 8px;
    background: var(--tinta);
    color: var(--papel);
    border: none;
    padding: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .caja-registro button:hover { background: #000; }

  #confirmacion {
    font-size: 0.72rem;
    color: var(--sello-verde);
    min-height: 16px;
    margin-top: 8px;
    text-align: center;
  }

  .linea-item {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px;
    font-size: 0.82rem;
    padding: 6px 0;
  }
  .linea-item .desc { white-space: nowrap; }
  .linea-item .puntos {
    flex: 1;
    border-bottom: 1px dotted var(--tinta-suave);
    height: 0;
    transform: translateY(-3px);
  }
  .linea-item .monto { font-weight: 600; white-space: nowrap; }
  .linea-item .meta {
    display: block;
    font-size: 0.64rem;
    color: var(--tinta-suave);
    margin-top: -2px;
  }

  .sello-categoria {
    display: inline-block;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--sello-rojo);
    border: 1px dashed var(--sello-rojo);
    padding: 1px 6px;
    border-radius: 3px;
    transform: rotate(-2deg);
    margin-right: 6px;
  }

  .separador-doble { border: none; border-top: 2px dashed var(--linea); margin: 14px 0 10px; }

  .total-linea {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 0.95rem;
    padding-top: 6px;
  }

  .firma {
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    color: var(--tinta-suave);
    margin-top: 16px;
    transform: rotate(-1deg);
  }

  /* ============ VISTA: EXTRACTO (gráficas grandes) ============ */
  .contenedor-extracto { width: 100%; max-width: 820px; }

  .extracto {
    background: var(--papel);
    box-shadow: 0 20px 45px rgba(0,0,0,0.45);
    padding: 28px 30px 34px;
  }
  .extracto h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--tinta-suave);
    border-bottom: 1px dashed var(--linea);
    padding-bottom: 12px;
    margin: 0 0 22px;
  }

  .graficas-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-bottom: 10px;
  }
  @media (max-width: 720px) { .graficas-grid { grid-template-columns: 1fr; } }

  .caja-grafica { display: flex; flex-direction: column; }
  .grafica-titulo {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--tinta-suave);
    margin-bottom: 10px;
  }
  .lienzo-wrap { position: relative; height: 300px; }

  .totales-rapidos {
    display: flex;
    gap: 24px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px dashed var(--linea);
    flex-wrap: wrap;
  }
  .totales-rapidos .item { text-align: left; }
  .totales-rapidos .label {
    font-size: 0.62rem;
    text-transform: uppercase;
    color: var(--tinta-suave);
    letter-spacing: 0.05em;
  }
  .totales-rapidos .valor {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--sello-rojo);
  }
</style>
</head>
<body>

<div class="barra-pestanas">
  <button class="pestana activa" data-vista="registrar" onclick="cambiarVista('registrar')">Registrar</button>
  <button class="pestana" data-vista="extracto" onclick="cambiarVista('extracto')">Extracto</button>
</div>

<!-- ===== VISTA REGISTRAR ===== -->
<div class="vista activa" id="vista-registrar">
  <div class="contenedor-recibo">
    <div class="recibo">
      <div class="titulo">
        Mis Gastos
        <span class="sub">registro personal · sin bancos, sin nubes</span>
      </div>

      <div class="caja-registro">
        <textarea id="texto-gasto" rows="2" placeholder="Ej: ayer me compré un café por 2.50 y hoy pagué 45 del súper..."></textarea>
        <button onclick="registrarGasto()">Registrar gasto</button>
        <div id="confirmacion"></div>
      </div>

      <div id="lista-gastos"></div>

      <hr class="separador-doble" />
      <div class="total-linea">
        <span>Total (últimos 20)</span>
        <span id="total-mostrado">$0.00</span>
      </div>

      <div class="firma">gracias por su compra ✦</div>
    </div>
  </div>
</div>

<!-- ===== VISTA EXTRACTO ===== -->
<div class="vista" id="vista-extracto">
  <div class="contenedor-extracto">
    <div class="extracto">
      <h2>Resumen del mes</h2>

      <div class="graficas-grid">
        <div class="caja-grafica">
          <div class="grafica-titulo">Por categoría</div>
          <div class="lienzo-wrap"><canvas id="chartCategoria"></canvas></div>
        </div>
        <div class="caja-grafica">
          <div class="grafica-titulo">Por mes</div>
          <div class="lienzo-wrap"><canvas id="chartMes"></canvas></div>
        </div>
      </div>

      <div class="totales-rapidos" id="totales-rapidos"></div>
    </div>
  </div>
</div>

<script>
let chartCategoria, chartMes;
const COLORES = ["#a13d2e", "#3f6b4f", "#6b6a5f", "#8c6b3f", "#3f5a6b", "#7a3f6b", "#4f6b3f"];

function cambiarVista(nombre) {
  document.querySelectorAll(".vista").forEach(v => v.classList.remove("activa"));
  document.querySelectorAll(".pestana").forEach(p => p.classList.remove("activa"));
  document.getElementById(`vista-${nombre}`).classList.add("activa");
  document.querySelector(`.pestana[data-vista="${nombre}"]`).classList.add("activa");

  if (nombre === "extracto") {
    // Chart.js necesita redibujarse cuando el canvas pasa de display:none a visible
    setTimeout(() => { cargarGraficaCategoria(); cargarGraficaMes(); }, 30);
  }
}

async function registrarGasto() {
  const input = document.getElementById("texto-gasto");
  const texto = input.value.trim();
  if (!texto) return;

  document.getElementById("confirmacion").innerText = "procesando…";

  const formData = new FormData();
  formData.append("texto", texto);

  const res = await fetch("/registrar", { method: "POST", body: formData });
  const data = await res.json();

  const resumen = data.gastos_guardados.map(g => `${g.descripcion} ($${g.monto})`).join(", ");
  document.getElementById("confirmacion").innerText = `✓ registrado: ${resumen}`;
  input.value = "";

  cargarLista();
}

async function cargarLista() {
  const res = await fetch("/gastos?limite=20");
  const data = await res.json();
  const cont = document.getElementById("lista-gastos");
  cont.innerHTML = "";

  let total = 0;
  data.gastos.forEach(g => {
    total += g.monto;
    const div = document.createElement("div");
    div.className = "linea-item";
    div.innerHTML = `
      <span class="desc">${g.descripcion}</span>
      <span class="puntos"></span>
      <span class="monto">$${g.monto.toFixed(2)}</span>
      <span class="meta" style="flex-basis: 100%;"><span class="sello-categoria">${g.categoria}</span>${g.fecha}</span>
    `;
    cont.appendChild(div);
  });

  document.getElementById("total-mostrado").innerText = `$${total.toFixed(2)}`;
}

async function cargarGraficaCategoria() {
  const res = await fetch("/resumen/categoria");
  const data = await res.json();

  const ctx = document.getElementById("chartCategoria");
  if (chartCategoria) chartCategoria.destroy();
  chartCategoria = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: data.resumen.map(r => r.categoria),
      datasets: [{ data: data.resumen.map(r => r.total), backgroundColor: COLORES, borderWidth: 0 }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { color: "#24241f", font: { size: 11, family: "JetBrains Mono" } } } },
    },
  });

  const totalGeneral = data.resumen.reduce((acc, r) => acc + r.total, 0);
  const mayorCategoria = data.resumen[0];
  document.getElementById("totales-rapidos").innerHTML = `
    <div class="item"><div class="label">Total general</div><div class="valor">$${totalGeneral.toFixed(2)}</div></div>
    <div class="item"><div class="label">Mayor categoría</div><div class="valor">${mayorCategoria ? mayorCategoria.categoria : "—"}</div></div>
  `;
}

async function cargarGraficaMes() {
  const res = await fetch("/resumen/mes");
  const data = await res.json();

  const ctx = document.getElementById("chartMes");
  if (chartMes) chartMes.destroy();
  chartMes = new Chart(ctx, {
    type: "bar",
    data: {
      labels: data.resumen.map(r => r.mes),
      datasets: [{ data: data.resumen.map(r => r.total), backgroundColor: "#a13d2e" }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#6b6a5f", font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { color: "#6b6a5f", font: { size: 10 } }, grid: { color: "#e8e5dc" } },
      },
    },
  });
}

document.getElementById("texto-gasto").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    registrarGasto();
  }
});

cargarLista();
</script>
</body>
</html>
